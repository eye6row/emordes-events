<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="icon" href="wordmark.png"><title>Event / Emordes</title></head><body>
<main id="m"></main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><form class="box" id="co">
<p class="meta">Demo checkout / no payment taken</p><h2 id="mt">Your details</h2><div id="sum" class="meta"></div>
<input name="name" required placeholder="Full name" autocomplete="name"><input name="email" type="email" required placeholder="Email" autocomplete="email">
<button class="red" type="submit">Get tickets</button><button type="button" id="cx">Cancel</button></form></div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script> <script src="events.js"></script><script src="common.js"></script><script>
header("");
const e=getEvent(qp("id"))||EVENTS[0]; document.title=e.title+" / Emordes";
const q=e.tiers.map((t,i)=>i===0?1:0);
$("#m").innerHTML=`<section class="detail"><div class="img">${imgBlock(e.image)}</div><div class="info">
<div><p class="meta">${esc(e.kicker)} ${e.placeholder?'<span class="ph">Placeholder</span>':''}</p><h1 style="font-size:clamp(40px,6vw,84px)">${esc(e.title)}</h1></div>
<p style="line-height:1.7;color:#ccc">${esc(e.description)}</p>
<div class="spec"><span class="meta">Date</span><span>${fmtDate(e.date)}</span><span class="meta">Time</span><span>${esc(e.time)}</span><span class="meta">Venue</span><span>${esc(e.venue)}</span><span class="meta">Address</span><span><a href="https://maps.google.com/?q=${encodeURIComponent(e.venue+' '+e.address)}" target="_blank" rel="noopener">${esc(e.address)} ↗</a></span><span class="meta">Capacity</span><span>${e.capacity}</span></div>
<div><h3>Tickets</h3><div id="tiers"></div></div>
<div class="total"><span>Total</span><span id="tot"></span></div>
<button class="red" id="buy">Buy tickets</button>
<p class="meta">Questions: <a href="mailto:jh@emordes.studio">jh@emordes.studio</a> / <a href="live.html?id=${e.id}">Event-day page</a></p></div></section>`;
function render(){
 $("#tiers").innerHTML=e.tiers.map((t,i)=>`<div class="tier"><div><b style="font-family:var(--head);font-size:16px;text-transform:uppercase">${esc(t.name)}</b> <span>${money(t.price)}</span><div class="meta">${esc(t.note)}</div></div>
 <div class="qty"><button aria-label="less" data-i="${i}" data-d="-1">−</button><span>${q[i]}</span><button aria-label="more" data-i="${i}" data-d="1">+</button></div></div>`).join("");
 $("#tot").textContent="$"+e.tiers.reduce((s,t,i)=>s+t.price*q[i],0);
}
render();
$("#tiers").onclick=ev=>{const b=ev.target.closest("button");if(!b)return;const i=+b.dataset.i;q[i]=Math.max(0,Math.min(10,q[i]+ +b.dataset.d));render()};
$("#buy").onclick=()=>{
 const sel=e.tiers.map((t,i)=>({t,n:q[i]})).filter(x=>x.n>0);
 if(!sel.length){alert("Pick at least one ticket");return}
 const link=sel.length===1&&sel[0].t.stripePaymentLink;
 if(link){location.href=link;return}
 if(sel.some(x=>x.t.stripePaymentLink)&&sel.length>1){alert("Please buy one ticket type at a time");return}
 $("#sum").textContent=sel.map(x=>x.n+" × "+x.t.name).join(", ");$("#modal").classList.add("on");$("#co [name=name]").focus();
};
$("#cx").onclick=()=>$("#modal").classList.remove("on");
$("#co").onsubmit=ev=>{ev.preventDefault();const f=new FormData(ev.target);const all=store.get("emordes_tickets");let first;
 e.tiers.forEach((t,i)=>{for(let k=0;k<q[i];k++){const id="EMD-"+crypto.getRandomValues(new Uint32Array(1))[0].toString(36).toUpperCase().padStart(7,"0");
  const tk={id,event:e.id,tier:t.name,name:f.get("name"),email:f.get("email"),at:Date.now()};all.push(tk);first=first||id}});
 store.set("emordes_tickets",all);location.href="tickets.html?new="+e.id;};
</script></body></html>
